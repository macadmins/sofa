name: 07 - CSAF update

# Apple's CSAF JSON per advisory, requested separately from the main pipeline: Apple
# throttles these requests per IP (from GitHub runners about one every ~2 min), and
# publishing a new bulletin must not wait for them.
# - the main pipeline (01) requests JSON only for new advisories, within 60 s
# - this workflow re-checks known advisories and completes what 01 had no time for,
#   twice a day, outside Apple's release window (weekdays 18:00-22:00 CET, when 01 runs
#   hourly): 23:15 UTC catches the evening's releases, 11:15 UTC re-checks
# Two jobs: `fetch` takes its time without holding the lock; `apply` merges the result
# into the latest main inside the lock shared with 01 (seconds), rebuilds and deploys
# only when Apple's content changed, otherwise commits just the check times.

on:
  schedule:
    # UTC. Busy window is 16:00-21:59 UTC (18-22 CET/CEST); 01 also runs at :30 every 6 h.
    # The fetch takes up to 15 min, so both runs finish before 01's next run.
    - cron: "15 23 * * *"
    - cron: "15 11 * * *"
  workflow_dispatch:
    inputs:
      budget:
        description: "Seconds for requests to Apple"
        default: "900"

permissions:
  contents: write
  actions: write

env:
  SOFA_CLI: https://github.com/headmin/sofa-core-cli/releases/download/v0.3.7/sofa-0.3.7-linux-x86_64.tar.gz

jobs:
  fetch:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # one fetch at a time; it does not block 01
    concurrency:
      group: sofa-csaf-fetch
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Download SOFA CLI binaries
        run: |
          mkdir -p bin && curl -L -f "$SOFA_CLI" | tar xz -C bin/ && chmod +x bin/*
          ./bin/sofa-fetch --version

      - name: Fetch Apple's CSAF JSON
        run: ./bin/sofa-fetch csaf --budget "${{ github.event.inputs.budget || '900' }}"

      - uses: actions/upload-artifact@v6
        with:
          name: csaf
          path: |
            data/resources/apple_security_csaf.ndjson
            data/resources/csaf/
          retention-days: 1

  apply:
    needs: fetch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # shared with 01: never commit at the same time (01 pushes without retry)
    concurrency:
      group: sofa-data
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/download-artifact@v6
        with:
          name: csaf
          path: ${{ runner.temp }}/csaf

      - name: Download SOFA CLI binaries
        run: |
          mkdir -p bin && curl -L -f "$SOFA_CLI" | tar xz -C bin/ && chmod +x bin/*

      - name: Merge into the latest data
        run: |
          mkdir -p data/resources/csaf
          cp -n "${{ runner.temp }}"/csaf/csaf/* data/resources/csaf/ 2>/dev/null || true
          ./bin/sofa-fetch csaf --merge-from "${{ runner.temp }}/csaf/apple_security_csaf.ndjson"

      - name: Check for changes
        id: changes
        run: |
          # content: a new revision in the archive or a logged change -> rebuild and deploy
          if git status --porcelain data/resources/csaf data/resources/apple_csaf_changes.ndjson | grep -q .; then
            echo "content=true" >> "$GITHUB_OUTPUT"
          fi
          # check times only (304s): commit them so the rotation knows what was confirmed
          if git status --porcelain data/resources/apple_security_csaf.ndjson | grep -q .; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: astral-sh/setup-uv@v7
        if: steps.changes.outputs.content == 'true'
        with:
          version: "0.13.4"

      - name: Rebuild feeds
        if: steps.changes.outputs.content == 'true'
        run: |
          export SOFA_BIN_PATH="./bin" PATH="./bin:$PATH"
          uv run --script scripts/sofa_pipeline.py run build
          uv run --script scripts/sofa_pipeline.py run bulletin

      - name: Commit and push
        if: steps.changes.outputs.content == 'true' || steps.changes.outputs.checked == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "SOFA Pipeline"
          if [ "${{ steps.changes.outputs.content }}" = "true" ]; then
            git add data/resources/ v1/ v2/
            msg="🔄 SOFA CSAF update"
          else
            git add data/resources/apple_security_csaf.ndjson
            msg="🔄 SOFA CSAF check"
          fi
          git diff --staged --quiet && { echo "Nothing to commit"; exit 0; }
          git commit -m "$msg - $(date -u '+%Y-%m-%d %H:%M UTC')"
          git pull --rebase --autostash && git push

      - name: Deploy
        if: steps.changes.outputs.content == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run 02_r2-upload.yml --ref main
          gh workflow run 03_sofa-deploy-feeds.yml --ref main -f environment=production
